name: EdgeIQ CI

on:
  push:
    branches: ["main", "codex/**", "codex-*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: >-
          mypy
          analytics/pipeline_types.py
          analytics/release_validation.py
          analytics/entry_recommendation.py
          analytics/probabilistic_forecast.py
          analytics/model_version_evaluation.py
          analytics/model_registry.py
          analytics/model_selection.py
          services/probability.py
          services/data_management.py
          services/odds.py
          services/background_jobs.py
          utils/entity_normalization.py
          utils/platforms.py
          utils/sports.py
          utils/ttl_cache.py
          utils/logging_config.py
          web/application
          web/routers
          web/schemas
      - name: Reject tracked local databases
        run: test -z "$(git ls-files '*.db' '*.db-wal' '*.db-shm')"
      - name: Verify formal database migration
        run: DATABASE_URL=sqlite:////tmp/edgeiq-ci.db alembic upgrade head
      - run: pytest

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/visual_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edgeiq-visual-regression
          path: artifacts/visual-regression/
