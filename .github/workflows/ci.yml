name: EdgeIQ CI

on:
  push:
    branches: ["main", "codex/**", "codex-*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: >-
          mypy
          analytics/release_validation.py
          services/data_management.py
          services/odds.py
          utils/entity_normalization.py
          web/application
          web/routers
          web/schemas
      - name: Reject tracked local databases
        run: test -z "$(git ls-files '*.db' '*.db-wal' '*.db-shm')"
      - name: Verify formal database migration
        run: DATABASE_URL=sqlite:////tmp/edgeiq-ci.db alembic upgrade head
      - run: pytest
