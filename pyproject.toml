[project]
name = "edgeiq"
version = "2.4.1"
description = "Desktop, browser, and CLI platform for player-prop research, probabilistic forecasting, entry validation, and performance tracking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "PyQt6==6.11.0",
    "PyQt6-Charts==6.11.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "curl-cffi==0.13.0",
    "rich==15.0.0",
    "SQLAlchemy==2.0.51",
    "uvicorn>=0.30.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "config", "desktop"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "analytics*",
    "data*",
    "gui*",
    "models*",
    "repository*",
    "services*",
    "ui*",
    "utils*",
    "web*",
]
exclude = ["tests*", "artifacts*", "assets*", "migrations*"]
namespaces = true

[project.optional-dependencies]
dev = [
    "alembic>=1.14",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "playwright>=1.49,<2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "performance: deterministic runtime-budget regression checks",
    "concurrency: simultaneous-operation and idempotency checks",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
