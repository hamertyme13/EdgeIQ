[project]
name = "edgeiq"
version = "2.1.0a0"
description = "Desktop and CLI tools for player prop analysis and bet tracking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "PyQt6==6.11.0",
    "PyQt6-Charts==6.11.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "rich==15.0.0",
    "SQLAlchemy==2.0.51",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
