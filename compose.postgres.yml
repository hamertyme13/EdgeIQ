name: edgeiq-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edgeiq
      POSTGRES_USER: edgeiq
      POSTGRES_PASSWORD: ${EDGEIQ_LOCAL_POSTGRES_PASSWORD:?Create the local PostgreSQL credential first}
    ports:
      - "127.0.0.1:${EDGEIQ_LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - edgeiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeiq -d edgeiq"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrator:
    build: .
    profiles: ["migration"]
    environment:
      DATABASE_URL: postgresql+psycopg://edgeiq:${EDGEIQ_LOCAL_POSTGRES_PASSWORD}@db:5432/edgeiq
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

volumes:
  edgeiq-postgres-data:
